server:
  port: 8080
  mode: debug # debug, release

grpc:
  auth_service:
    port: 50051
    host: localhost
  todo_service:
    port: 50052
    host: localhost

database:
  mongodb:
    uri: mongodb://localhost:27017
    database: todoapp
    timeout: 10

jwt:
  secret: your-secret-key-change-in-production
  expiration: 24 # hours

logger:
  level: debug # debug, info, warn, error
  encoding: json # json, console

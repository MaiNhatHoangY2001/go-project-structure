syntax = "proto3";

package todo;

option go_package = "github.com/MaiNhatHoangY2001/go-project-structure/proto/todo";

// TodoService handles todo CRUD operations
service TodoService {
  // CreateTodo creates a new todo item
  rpc CreateTodo(CreateTodoRequest) returns (TodoResponse);
  
  // GetTodo retrieves a todo by ID
  rpc GetTodo(GetTodoRequest) returns (TodoResponse);
  
  // ListTodos lists todos for a user with pagination
  rpc ListTodos(ListTodosRequest) returns (ListTodosResponse);
  
  // UpdateTodo updates a todo item
  rpc UpdateTodo(UpdateTodoRequest) returns (TodoResponse);
  
  // DeleteTodo deletes a todo item
  rpc DeleteTodo(DeleteTodoRequest) returns (DeleteTodoResponse);
}

message CreateTodoRequest {
  string user_id = 1;
  string title = 2;
  string description = 3;
}

message GetTodoRequest {
  string user_id = 1;
  string todo_id = 2;
}

message ListTodosRequest {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  optional bool completed = 4;
}

message UpdateTodoRequest {
  string user_id = 1;
  string todo_id = 2;
  optional string title = 3;
  optional string description = 4;
  optional bool completed = 5;
}

message DeleteTodoRequest {
  string user_id = 1;
  string todo_id = 2;
}

message TodoResponse {
  string id = 1;
  string user_id = 2;
  string title = 3;
  string description = 4;
  bool completed = 5;
  string created_at = 6;
  string updated_at = 7;
}

message ListTodosResponse {
  repeated TodoResponse todos = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message DeleteTodoResponse {
  bool success = 1;
  string message = 2;
}
